<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat Assistant</title>

    <!-- Local CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <!-- External Libraries (CDN) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="light-mode">
    <div class="container">
        <header class="header">
            <h1><i class="fas fa-robot"></i> AI Chat Assistant</h1>
            <button id="themeToggle" class="theme-toggle">
                <i class="fas fa-moon"></i> Dark Mode
            </button>
        </header>

        <div class="chat-container">
            <div class="chat-messages" id="chatMessages">
                <div class="message ai-message">
                    <div class="message-content">
                        <div class="message-header">
                            <i class="fas fa-robot"></i> AI Assistant
                        </div>
                        <div class="message-text">
                            <p>Hello! I'm your AI assistant. Ask me anything and I'll help you with your questions.</p>
                            <p class="hint">Try asking: "What is machine learning?" or "Explain quantum computing"</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="input-area">
                <div class="input-wrapper">
                    <textarea id="questionInput"
                        placeholder="Type your question here... (Press Enter to send, Shift+Enter for new line)"
                        rows="1"></textarea>
                    <button id="sendButton" class="send-button">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
                <div class="status">
                    <span id="apiStatus">AI Assistant Ready</span>
                </div>
            </div>
        </div>

        <div class="loading" id="loading">
            <div class="dots">
                <span></span>
                <span></span>
                <span></span>
            </div>
            <p>Thinking...</p>
        </div>
    </div>

    <!-- JavaScript Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- Application JavaScript -->
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>

</html>
